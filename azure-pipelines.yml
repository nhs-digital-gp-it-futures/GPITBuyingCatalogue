variables:
  - name: dotnetVersion
    value: '10.0.201'
  - name: MSBUILDSINGLELOADCONTEXT
    value: '1'
  - name: buildConfiguration
    value: Release
  - group: dev-acr-secrets

trigger:
  branches:
    include:
      - develop

pr:
  - develop
  - feature/*

jobs:
  - job: version
    displayName: Work out version
    pool:
      vmImage: 'ubuntu-latest'
    steps:
      - task: gitversion/setup@0
        displayName: Setup GitVersion
        inputs:
          versionSpec: '5.x'

      - task: gitversion/execute@0
        displayName: Execute GitVersion
        name: version

      - script: echo "##vso[task.setvariable variable=semVer;isOutput=true]$(version.SemVer)"
        name: setVersionStep

      - script: echo semVer $(setVersionStep.semVer)
        name: echovar

  - job: dockerBuildAndPush
    displayName: Build and Package
    variables:
      semVer: $[ dependencies.version.outputs['setVersionStep.semVer'] ]
      ${{ if eq(variables['Build.SourceBranchName'], 'main') }}:
        latestTag: latest
      ${{ if ne(variables['Build.SourceBranchName'], 'main') }}:
        latestTag: latestbuild

  - job: runTests
    displayName: Run Tests

    pool:
      vmImage: 'ubuntu-latest'
    
    strategy:
      maxParallel: 3
      matrix:
        webApp:
          testGroup: webapp
          testProjects: tests/NHSD.GPIT.BuyingCatalogue.WebApp.UnitTests/NHSD.GPIT.BuyingCatalogue.WebApp.UnitTests.csproj

        services:
          testGroup: e2e
          testProjects: |
            tests/NHSD.GPIT.BuyingCatalogue.PlaywrightTests/NHSD.GPIT.BuyingCatalogue.PlaywrightTests.csproj
            tests/NHSD.GPIT.BuyingCatalogue.RegressionTests/NHSD.GPIT.BuyingCatalogue.RegressionTests.csproj


        remaining:
          testGroup: remaining
          testProjects: |
            tests/NHSD.GPIT.BuyingCatalogue.Services.UnitTests/NHSD.GPIT.BuyingCatalogue.Services.UnitTests.csproj
            tests/BuyingCatalogueFunctionUnitTests/BuyingCatalogueFunctionUnitTests.csproj
            tests/NHSD.GPIT.BuyingCatalogue.EntityFramework.UnitTests/NHSD.GPIT.BuyingCatalogue.EntityFramework.UnitTests.csproj
            tests/NHSD.GPIT.BuyingCatalogue.Framework.UnitTests/NHSD.GPIT.BuyingCatalogue.Framework.UnitTests.csproj
            tests/NHSD.GPIT.BuyingCatalogue.ServiceContracts.UnitTests/NHSD.GPIT.BuyingCatalogue.ServiceContracts.UnitTests.csproj
            tests/NHSD.GPIT.BuyingCatalogue.UI.Components.UnitTests/NHSD.GPIT.BuyingCatalogue.UI.Components.UnitTests.csproj

      steps:
        - task: UseDotNet@2
          displayName: 'Use DotNet $(dotnetVersion)'
          inputs:
            version: $(dotnetVersion)
            includePreviewVersions: false

        - task: DotNetCoreCLI@2
          displayName: Restore $(testGroup) tests
          inputs:
            command: restore
            projects: $(testProjects)
            feedsToUse: config
            nugetConfigPath: NuGet.config

        - task: DotNetCoreCLI@2
          displayName: Run $(testGroup) tests
          inputs:
            command: test
            projects: $(testProjects)
            arguments: >-
              --no-restore
              --configuration $(buildConfiguration)
              --collect:"XPlat Code Coverage;Format=opencover"
              --results-directory "$(Agent.TempDirectory)/test-results/$(testGroup)"
              --
                xUnit.ParallelizeTestCollections=true
                xUnit.MaxParallelThreads=4
            publishTestResults: true

        - publish: $(Agent.TempDirectory)/test-results/$(testGroup)
          displayName: Publish $(testGroup) coverage
          artifact: coverage-$(testGroup)
          condition: succeededOrFailed()



    dependsOn: 
      - version
      - runTests
    pool:
      vmImage: 'ubuntu-latest'

    steps:
      - task: UseDotNet@2
        displayName: 'Use DotNet $(dotnetVersion)'
        inputs:
          version: $(dotnetVersion)
          includePreviewVersions: false

      - task: DotNetCoreCLI@2
        displayName: 'Run dotnet restore'
        inputs:
          command: restore
          projects: |
            NHSD.GPIT.BuyingCatalogue.sln
            NHSD.GPIT.BuyingCatalogue.Database.sln
          feedsToUse: config
          nugetConfigPath: 'NuGet.config'

      - task: NodeTool@0
        displayName: 'Install Node.js'
        inputs:
          versionSpec: '14.x'

      - task: Npm@1
        displayName: 'Run npm install'
        inputs:
          command: 'install'
          workingDir: 'src/NHSD.GPIT.BuyingCatalogue.WebApp'

      - download: current
        patterns: |
          coverage-*/**/coverage.opencover.xml
        displayName: Download unit-test coverage

      - task: SonarCloudPrepare@3
        inputs:
          SonarCloud: 'SonarCloud'
          organization: '$(SonarOrganization)'
          scannerMode: 'dotnet'
          projectKey: '$(SonarKey)'
          projectName: '$(SonarProject)'
          extraProperties: |
            sonar.cs.opencover.reportsPaths=$(Pipeline.Workspace)/coverage-*/**/coverage.opencover.xml
            sonar.exclusions=src/NHSD.GPIT.BuyingCatalogue.UI.Components/**,src/NHSD.GPIT.BuyingCatalogue.UI.Components.WebApp/**,**/*.cshtml,**/*.ts,tests/**

      - task: DotNetCoreCLI@2
        displayName: 'Run dotnet build'
        inputs:
          command: build
          projects: |
            NHSD.GPIT.BuyingCatalogue.sln
            NHSD.GPIT.BuyingCatalogue.Database.sln
          arguments: '--no-restore --configuration $(buildConfiguration)'

      - task: gulp@0
        displayName: 'Run gulp min'
        inputs:
          gulpFile: 'src/NHSD.GPIT.BuyingCatalogue.WebApp/gulpfile.js'
          targets: 'min'
          workingDirectory: 'src/NHSD.GPIT.BuyingCatalogue.WebApp'

      # - task: DotNetCoreCLI@2
      #   displayName: 'Run unit tests'
      #   inputs:
      #     command: test
      #     projects: '**/*UnitTests.csproj'
      #     arguments: '--no-build --configuration $(buildConfiguration) --collect:"XPlat Code Coverage;Format=opencover" -- xunit.parallelizeTestCollections=true'
      #     publishTestResults: false

      - task: SonarCloudAnalyze@3
      - task: SonarCloudPublish@3

      - task: DotNetCoreCLI@2
        displayName: Publish BuyingCatalogueFunction
        inputs:
          command: "publish"
          projects: "src/BuyingCatalogueFunction"
          arguments: "--no-build --configuration $(buildConfiguration) -o $(Build.ArtifactStagingDirectory)/BuyingCatalogueFunction"
          publishWebProjects: false
          modifyOutputPath: false
          zipAfterPublish: true

      - publish: $(Build.ArtifactStagingDirectory)/BuyingCatalogueFunction
        artifact: BuyingCatalogueFunction

      - task: Docker@2
        displayName: 'Docker: Build and Push'
        condition: succeeded()
        inputs:
          containerRegistry: 'gpitfuturesdevacr'
          repository: 'nhsd/buying-catalogue/nhsdgpitbuyingcataloguewebapp'
          command: 'buildAndPush'
          Dockerfile: 'src/**/NHSD.GPIT.BuyingCatalogue.WebApp/Dockerfile'
          buildContext: './'
          tags: |
            $(semVer)
            $(latestTag)

      - task: PowerShell@2
        inputs:
          targetType: 'inline'
          script: |
            $release = "$(semVer)"
            mkdir $(Build.ArtifactStagingDirectory)/code
            $release | Out-File $(Build.ArtifactStagingDirectory)/code/release.txt

      - task: CopyFiles@2
        displayName: Copy DACPAC
        inputs:
          SourceFolder: 'database/NHSD.GPITBuyingCatalogue.Database'
          Contents: '**/*.dacpac'
          TargetFolder: '$(build.artifactStagingDirectory)/dacpacs'
          CleanTargetFolder: false
          OverWrite: true
          flattenFolders: true

      - task: CopyFiles@2
        displayName: Copy Smoke Test Scripts
        inputs:
          SourceFolder: 'tests/SmokeTests'
          Contents: '**/*.ps1'
          TargetFolder: '$(Build.ArtifactStagingDirectory)/smoke-tests'
          CleanTargetFolder: false
          OverWrite: true
          flattenFolders: false

      - publish: $(build.artifactStagingDirectory)/code
        displayName: Publish Code Version
        artifact: code-version

      - publish: $(build.artifactStagingDirectory)/dacpacs
        displayName: Publish DACPAC
        artifact: dacpacs

      - publish: $(Build.ArtifactStagingDirectory)/smoke-tests
        displayName: Publish Smoke Test Scripts
        artifact: smoke-tests

  - job: createBuildArtifact
    displayName: Publish Terraform
    pool:
      vmImage: 'ubuntu-latest'

    steps:
      - publish: terraform/functionapp
        displayName: Publish Terraform - Function App
        artifact: terraform-functionapp

      - publish: terraform/webapp
        displayName: Publish Terraform - WebApp
        artifact: build-artifact

      - publish: terraform/core
        displayName: Publish Terraform - Core
        artifact: core-terraform
